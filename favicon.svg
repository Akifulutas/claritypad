<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient: macOS Sequoia Deep Azure to Purple -->
    <linearGradient id="cpBg" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#0071e3" />
      <stop offset="50%" stop-color="#5856d6" />
      <stop offset="100%" stop-color="#af52de" />
    </linearGradient>

    <!-- Glass Specular Reflection -->
    <linearGradient id="cpSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18" />
    </linearGradient>

    <!-- Inner Glass Tablet Surface -->
    <linearGradient id="cpTablet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10" />
    </linearGradient>

    <!-- Gold / Radiant Accent Gradient for Pen Nib & Star -->
    <linearGradient id="cpGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd60a" />
      <stop offset="100%" stop-color="#ff9f0a" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cpShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0b1021" flood-opacity="0.35" />
    </filter>

    <filter id="cpGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Squircle Canvas Base -->
  <rect x="6" y="6" width="116" height="116" rx="27" fill="url(#cpBg)" />
  <rect x="6" y="6" width="116" height="116" rx="27" fill="url(#cpSheen)" />
  <rect x="6.75" y="6.75" width="114.5" height="114.5" rx="26.25" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="1.5" />

  <!-- 2. Floating Liquid Glass Pad Sheet -->
  <g filter="url(#cpShadow)">
    <rect x="22" y="20" width="84" height="88" rx="18" fill="url(#cpTablet)" />
    <rect x="22.75" y="20.75" width="82.5" height="86.5" rx="17.25" fill="none" stroke="rgba(255,255,255,0.48)" stroke-width="1.2" />

    <!-- Subtle Notebook Grid / Margin Rule -->
    <line x1="33" y1="20" x2="33" y2="108" stroke="rgba(255,255,255,0.18)" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="22" y1="36" x2="106" y2="36" stroke="rgba(255,255,255,0.14)" stroke-width="1" />
  </g>

  <!-- 3. Mathematical Centerpiece: Stylized Clarity "C" Integral + Sigma Fusion -->
  <!-- Stylized Integral / C curve -->
  <path d="M 76,46 C 73,43 68,41 62,41 C 49,41 41,51 41,64 C 41,77 49,87 62,87 C 69,87 74,84 78,80" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#cpGlow)" />

  <!-- Integral terminals / math nodes -->
  <circle cx="76" cy="46" r="3.2" fill="url(#cpGold)" />
  <circle cx="78" cy="80" r="3.2" fill="url(#cpGold)" />

  <!-- Inner Sigma / Square Root Accent -->
  <path d="M 52,55 L 63,55 L 56,64 L 64,73 L 52,73" 
        fill="none" 
        stroke="rgba(255,255,255,0.92)" 
        stroke-width="2.6" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- 4. Clarity Sparkle Star (Top Right) -->
  <path d="M 92,26 C 92,30 96,33 100,33 C 96,33 92,36 92,40 C 92,36 88,33 84,33 C 88,33 92,30 92,26 Z" 
        fill="url(#cpGold)" 
        filter="url(#cpGlow)" />
  <circle cx="92" cy="33" r="1.5" fill="#ffffff" />

  <!-- 5. Micro sparkle (Bottom Left) -->
  <path d="M 29,88 C 29,90 31,91.5 33,91.5 C 31,91.5 29,93 29,95 C 29,93 27,91.5 25,91.5 C 27,91.5 29,90 29,88 Z" 
        fill="rgba(255,255,255,0.7)" />
</svg>